seed: 0

dataset:
  name: refcoco
  partition: unc
  annotations: https://web.archive.org/web/20220413011718/https://bvisionweb1.cs.unc.edu/licheng/referit/data/refcoco.zip
  annotations_sha256: 7f924bb7ed8dc4568058e4ff626281918d56e5206f4c868c5a80f088f38c8bf0
  images: http://images.cocodataset.org/train2014
  root: data
  splits: [train, val, testA, testB]

input:
  size: [320, 320]

loader:
  batch_size: 8
  num_workers: 4
  augment: true
  flip_probability: 0.5
  expressions_per_object: 1   # training subset rule; evaluation always uses every expression

train:
  epochs: 20
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 0.05
  scheduler: cosine
  loss: combined
  dice_weight: 1.0
  early_stopping_patience: 5
  checkpoint_metric: val_miou
  checkpoint_mode: max

evaluation:
  metrics: [miou, dice]
  precision_threshold: 0.5
  example_predictions: 6
  output_dir: results/evaluation
  inference:
    batch_sizes: [1, 8]
    warmup_batches: 5
    timed_batches: 20

output_dir: results/runs
